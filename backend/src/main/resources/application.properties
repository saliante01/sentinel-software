spring.application.name=sentinel-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/sentinel;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.mapper.accept-case-insensitive-enums=true

sentinel.monitoring.connect-timeout=2s
sentinel.monitoring.read-timeout=5s
sentinel.monitoring.allow-private-targets=false
sentinel.monitoring.scheduler.enabled=true
sentinel.monitoring.scheduler.minimum-interval=60s
# sentinel.monitoring.allowed-hosts=example.com,api.example.com
